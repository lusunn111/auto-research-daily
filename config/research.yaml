version: 1

research_profile:
  name: 具身智能与世界模型系统研究
  description: >-
    面向具身智能、视觉语言动作模型、世界模型、物理人工智能、世界动作模型与系统优化，
    重点关注可执行动作生成、长时序预测、推理效率、模型压缩、实时控制和真实机器人评测。
  core_terms:
    - vision-language-action
    - vision language action
    - VLA
    - world action model
    - action-conditioned world model
    - robot world model
    - latent action model
    - generalist robot policy
    - robot foundation model
    - embodied intelligence
    - physical AI
    - robotic manipulation
    - humanoid robot
  adjacent_terms:
    - video generation
    - action chunking
    - diffusion policy
    - flow matching
    - model predictive control
    - imitation learning
    - sim-to-real
    - spatial reasoning
    - 3D representation
    - multimodal policy
    - efficient inference
    - model quantization
    - speculative decoding
  negative_terms:
    - medical image segmentation
    - text-to-image diffusion
    - quantum quantization
    - financial trading
  topic_axes:
    task:
      - manipulation
      - navigation
      - locomotion
      - autonomous driving
      - humanoid
    model:
      - VLA
      - world model
      - WAM
      - policy
      - planner
    systems:
      - latency
      - throughput
      - memory
      - quantization
      - serving
      - edge deployment

sources:
  arxiv:
    enabled: true
    categories: [cs.RO, cs.CV, cs.AI, cs.LG, cs.CL]
    lookback_days: 3
    request_delay_seconds: 3.0
    timeout_seconds: 60.0
    retries: 4
    max_records: 2500
  zotero:
    enabled: true
    max_items: 500
    include_collections: []
    exclude_collections: []

ranking:
  candidate_pool: 120
  publish_limit: 40
  min_prefilter_score: 0.08
  min_llm_relevance: 6
  personal_weight: 0.45
  topic_weight: 0.35
  recency_weight: 0.10
  exploration_weight: 0.10
  diversity_lambda: 0.78

analysis:
  enabled: true
  max_papers: 60
  max_concurrency: 4
  max_failure_ratio: 0.30
  prompt_version: "paper-analysis-v1"
  brief_max_output_tokens: 2500
  deep_max_output_tokens: 5000
  full_text_top_k: 12
  full_text_max_chars: 18000
  brief_model_default: deepseek-v4-flash
  deep_model_default: deepseek-v4-flash
  brief_thinking: false
  deep_thinking: false
  brief_reasoning_effort: low
  deep_reasoning_effort: low
  base_url_default: https://api.deepseek.com

output:
  data_dir: data
  reports_dir: reports
  site_dir: site
  title: 具身智能自动科研日报
  timezone: Asia/Shanghai
