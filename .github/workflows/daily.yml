name: Daily Research Update

on:
  schedule:
    - cron: "30 4 * * *" # 北京时间每日 12:30，避开当前 API 峰值时段
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 向前检索多少天
        type: number
        default: 3
      max_papers:
        description: 最多送入大模型分析的论文数
        type: number
        default: 60
      deep_limit:
        description: 最多读取全文的论文数
        type: number
        default: 10
      dry_run:
        description: 只运行，不写入、提交或部署；非默认分支将强制开启
        type: boolean
        default: false
      send_email:
        description: 手动运行时是否在部署成功后发送邮件；定时任务默认发送
        type: boolean
        default: false

permissions: {}

concurrency:
  group: auto-research-daily
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dry_run: ${{ steps.options.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.9.0"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Validate inputs
        id: options
        shell: bash
        env:
          INPUT_LOOKBACK: ${{ inputs.lookback_days }}
          INPUT_MAX_PAPERS: ${{ inputs.max_papers }}
          INPUT_DEEP_LIMIT: ${{ inputs.deep_limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          lookback="${INPUT_LOOKBACK:-3}"
          max_papers="${INPUT_MAX_PAPERS:-60}"
          deep_limit="${INPUT_DEEP_LIMIT:-10}"
          dry_run="${INPUT_DRY_RUN:-false}"
          [[ "$lookback" =~ ^([1-9]|[12][0-9]|3[01])$ ]] || exit 2
          [[ "$max_papers" =~ ^([1-9]|[1-9][0-9]|1[0-9][0-9]|200)$ ]] || exit 2
          [[ "$deep_limit" =~ ^([0-9]|[1-3][0-9]|40)$ ]] || exit 2
          [[ "$dry_run" == "true" || "$dry_run" == "false" ]] || exit 2
          if [[ "$CURRENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "非默认分支 $CURRENT_REF：强制使用只读试运行。"
            dry_run="true"
          fi
          {
            echo "lookback=$lookback"
            echo "max_papers=$max_papers"
            echo "deep_limit=$deep_limit"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      - name: Run daily pipeline
        shell: bash
        env:
          ARXIV_USER_AGENT: Auto-Research-Daily/0.1 (https://github.com/${{ github.repository }})
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_BRIEF_MODEL: ${{ vars.LLM_BRIEF_MODEL }}
          LLM_DEEP_MODEL: ${{ vars.LLM_DEEP_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          RUN_LOOKBACK: ${{ steps.options.outputs.lookback }}
          RUN_MAX_PAPERS: ${{ steps.options.outputs.max_papers }}
          RUN_DEEP_LIMIT: ${{ steps.options.outputs.deep_limit }}
          RUN_DRY_RUN: ${{ steps.options.outputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            daily
            --lookback-days "$RUN_LOOKBACK"
            --max-papers "$RUN_MAX_PAPERS"
            --deep-limit "$RUN_DEEP_LIMIT"
          )
          if [[ "$RUN_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run auto-research-daily "${args[@]}" | tee run-summary.json
      - name: Run regression tests
        run: |
          uv run ruff check src tests
          uv run pytest
      - name: Validate generated data
        if: steps.options.outputs.dry_run == 'false'
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from auto_research_daily.models import RunReport

          RunReport.model_validate_json(Path("data/latest.json").read_text(encoding="utf-8"))
          if not Path("site/index.html").is_file():
              raise SystemExit("site/index.html is missing")
          PY
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated public data
        if: steps.options.outputs.dry_run == 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generated-public-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data
            reports
            site
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    if: >-
      needs.update.outputs.dry_run == 'false' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Download generated public data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: generated-public-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Validate downloaded paths
        shell: bash
        run: |
          set -euo pipefail
          test -f data/latest.json
          test -f site/index.html
      - name: Commit generated public data
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "auto-research-daily-bot"
          git config user.email "auto-research-daily-bot@users.noreply.github.com"
          git add -- data reports site
          mapfile -t staged_paths < <(git diff --cached --name-only)
          for staged_path in "${staged_paths[@]}"; do
            case "$staged_path" in
              data/*|reports/*|site/*) ;;
              *) echo "拒绝提交意外路径：$staged_path" >&2; exit 1 ;;
            esac
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily research report"
            git fetch origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            git rebase "refs/remotes/origin/${DEFAULT_BRANCH}"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: [update, publish]
    if: >-
      needs.update.outputs.dry_run == 'false' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  notify:
    needs: [update, publish, deploy]
    if: >-
      needs.update.outputs.dry_run == 'false' &&
      needs.deploy.result == 'success' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.send_email == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout deployed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.9.0"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Send deployed daily report
        env:
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
        run: uv run auto-research-daily notify
      - name: Commit notification state only
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "auto-research-daily-bot"
          git config user.email "auto-research-daily-bot@users.noreply.github.com"
          git add -- data/notifications.json
          mapfile -t staged_paths < <(git diff --cached --name-only)
          for staged_path in "${staged_paths[@]}"; do
            [[ "$staged_path" == "data/notifications.json" ]] || exit 1
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: record daily email notification"
            git fetch origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            git rebase "refs/remotes/origin/${DEFAULT_BRANCH}"
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
          fi
