[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auto-research-daily"
version = "0.1.0"
description = "Evidence-aware personalized daily research discovery for embodied AI, world models, physical AI and WAM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pillow>=11.3,<13",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "selectolax>=0.4.0,<0.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1"
]

[project.scripts]
auto-research-daily = "auto_research_daily.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_research_daily"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
